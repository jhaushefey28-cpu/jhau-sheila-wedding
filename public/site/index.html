<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root{
    --ivory:#F7F1E6;
    --paper:#FFFCF6;
    --ink:#2E2620;
    --ink-soft:#5B5147;
    --gold:#B4913F;
    --gold-soft:#DCC98F;
    --pine:#33413A;
    --rose:#A8756A;
    --accent-1:#C9A227;
    --accent-2:#B23A55;
    --line: rgba(46,38,32,0.14);
    --shadow: 0 20px 60px rgba(46,38,32,0.16);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *,*::before,*::after{box-sizing:inherit;}
  :root{ --photo-filter: none; }
  /* Sage Garden — soft green, fresh and botanical */
  body[data-theme="sage-garden"]{
    --ivory:#E6EBDD; --paper:#F4F6EE; --ink:#263326; --ink-soft:#4F5F4C;
    --gold:#A6923F; --gold-soft:#CBC18C; --pine:#2F4733; --rose:#B4835F;
    --accent-1:#7FA050; --accent-2:#D4A017;
    --photo-filter: saturate(1.08) hue-rotate(6deg) brightness(1.01);
  }
  /* Sage & Blush — soft sage green with light pink accents.
     Tuned for contrast: before, the "gold" accent (used site-wide for
     labels/borders/numbers/CTA) WAS a pale dusty pink almost the same
     tone as --rose, so the pink repeated everywhere and read as flat
     and washed out. Now --gold carries a deeper, richer rose-mauve so
     it actually stands out against the pale backdrop, --pine carries
     a more saturated sage so the green half of the theme is visible
     too, and --rose/--accent-2 sit at a clearly different, brighter
     pink so nothing collapses into one hazy blur. */
  body[data-theme="sage-blush"]{
    --ivory:#E3ECDC; --paper:#F7FAF3; --ink:#24311E; --ink-soft:#49593F;
    --gold:#A85A6F; --gold-soft:#E6BEC7; --pine:#4C7244; --rose:#CE5F82;
    --accent-1:#4C8A50; --accent-2:#CF4A72;
    --photo-filter: saturate(1.12) hue-rotate(-4deg) brightness(1.02) contrast(1.03);
  }
  /* Dusty Rose — deeper blush with rose-gold, romantic */
  body[data-theme="dusty-rose"]{
    --ivory:#F0D9D6; --paper:#FBEDEA; --ink:#3C2730; --ink-soft:#6E4E58;
    --gold:#B97A6E; --gold-soft:#E4B9AE; --pine:#7C4650; --rose:#A14E5C;
    --accent-1:#C65B6E; --accent-2:#8A5A3D;
    --photo-filter: saturate(1.08) brightness(1.03) hue-rotate(-6deg);
  }
  /* Emerald Night — deep dark green, dramatic and formal */
  body[data-theme="emerald-night"]{
    --ivory:#0F2019; --paper:#17291F; --ink:#EDE7D6; --ink-soft:#B9C4B4;
    --gold:#D2AD5E; --gold-soft:#8C7640; --pine:#0A1510; --rose:#C28A6E;
    --accent-1:#D2AD5E; --accent-2:#2E8B57;
    --line: rgba(237,231,214,0.16);
    --photo-filter: contrast(1.08) saturate(1.05) brightness(.95) hue-rotate(2deg);
  }
  /* Champagne Taupe — warm neutral greige, modern and understated */
  body[data-theme="champagne-taupe"]{
    --ivory:#E4DCCF; --paper:#F2ECE1; --ink:#332B22; --ink-soft:#6A5D4C;
    --gold:#9C8057; --gold-soft:#D4C3A6; --pine:#55492F; --rose:#9A765A;
    --accent-1:#C9A227; --accent-2:#A65D6E;
    --photo-filter: sepia(.08) saturate(.95) brightness(1.02) contrast(1.02);
  }
  /* Midnight Gold — near-black with gold, formal black-tie evening */
  body[data-theme="midnight-gold"]{
    --ivory:#121110; --paper:#1C1916; --ink:#F2E8D6; --ink-soft:#C7BA9C;
    --gold:#D8AF57; --gold-soft:#8E7239; --pine:#0B0A09; --rose:#BE8268;
    --accent-1:#D8AF57; --accent-2:#9B2242;
    --line: rgba(242,232,214,0.16);
    --photo-filter: grayscale(.2) contrast(1.12) brightness(.9) saturate(.8);
  }
  html{scroll-behavior:smooth; scroll-padding-top: env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(255,255,255,.55), transparent 60%),
      var(--ivory);
    color:var(--ink);
    font-family:'Jost',sans-serif;
    font-weight:400;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{ position:relative; z-index:1; }
  h1,h2,h3,.serif{font-family:'Cormorant Garamond', serif; font-weight:500; letter-spacing:.01em;}
  .lede{color:var(--ink-soft); font-size:1.02rem; line-height:1.7; max-width:38ch;}

  /* ---------- app shell ---------- */
  #app{position:relative; width:100%; height:100vh; height:100dvh; overflow:hidden;}

  .stage{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .5s ease;
  }
  .stage.active{opacity:1; pointer-events:auto;}

  .panel{
    position:relative;
    width:min(560px, 88vw);
    max-height:82vh;
    overflow-y:auto;
    padding: 58px 44px 48px;
    text-align:center;
    background-color: var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(46,38,32,.045) 1px, transparent 0);
    background-size: 3px 3px;
    border:1px solid var(--gold-soft);
    box-shadow: var(--shadow), 0 0 0 6px var(--paper), 0 0 0 7px var(--gold-soft);
  }
  .panel::before{
    content:''; position:absolute; top:22px; left:50%; transform:translateX(-50%);
    width:44px; height:2px; background:var(--gold);
  }
  @media (max-width:480px){
    .panel{ padding: 46px 24px 36px; }
  }
  .panel::-webkit-scrollbar{width:5px;}
  .panel::-webkit-scrollbar-thumb{background:var(--line); border-radius:10px;}

  .eyebrow{
    font-family:'Jost',sans-serif;
    font-size:.76rem;
    color:var(--gold);
    letter-spacing:.14em;
    text-transform:uppercase;
    margin:0 0 14px;
  }
  .rule{
    position:relative;
    width:64px; height:1px; background:var(--gold-soft);
    margin:26px auto;
    border:none;
  }
  .rule::after{
    content:''; position:absolute; top:50%; left:50%;
    width:7px; height:7px; background:var(--gold);
    transform:translate(-50%,-50%) rotate(45deg);
  }
  .names{font-size:clamp(2.4rem, 7vw, 3.6rem); margin:0 0 8px; line-height:1.05;}
  .amp{color:var(--rose); font-style:italic;}
  .date-line{font-size:1.1rem; color:var(--ink-soft); margin:6px 0 0;}

  .countdown{ display:flex; gap:10px; justify-content:center; margin:24px 0 0; }
  .cd-box{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-width:58px; padding:10px 6px; border:1px solid var(--line); border-radius:4px;
    background:var(--paper);
  }
  .cd-num{ font-family:'Cormorant Garamond',serif; font-size:1.7rem; color:var(--gold); line-height:1; }
  .cd-label{ font-size:.66rem; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft); margin-top:4px; }

  button.cta{
    appearance:none; border:1px solid var(--ink);
    background:transparent; color:var(--ink);
    font-family:'Jost',sans-serif; font-size:.92rem; letter-spacing:.02em;
    padding:13px 34px; border-radius:2px;
    cursor:pointer; margin-top:30px;
    transition: background .25s ease, color .25s ease, border-color .25s ease;
  }
  button.cta:hover{background:var(--ink); color:var(--paper);}
  button.cta.gold{border-color:var(--gold); color:var(--gold);}
  button.cta.gold:hover{background:var(--gold); color:var(--paper);}
  button.cta:focus-visible, a:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}

  .frame-photo{
    width:210px; height:270px; margin:0 auto 6px;
    border-radius:100px 100px 8px 8px;
    border:1px solid var(--gold-soft);
    box-shadow:var(--shadow);
    background: var(--paper);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold-soft); font-family:'Cormorant Garamond',serif; font-size:2.4rem;
    overflow:hidden;
  }
  .frame-photo img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ---------- schedule ---------- */
  .sched-list{ text-align:left; margin:30px auto 0; max-width:380px; }
  .sched-item{ display:grid; grid-template-columns:74px 1fr; gap:16px; padding:14px 0; border-top:1px solid var(--line); }
  .sched-item:last-child{border-bottom:1px solid var(--line);}
  .sched-time{font-family:'Cormorant Garamond',serif; font-size:1.1rem; color:var(--gold); white-space:nowrap;}
  .sched-title{font-size:.98rem;}
  .sched-note{font-size:.85rem; color:var(--ink-soft); margin-top:3px;}

  /* ---------- venues ---------- */
  .venue-card{ text-align:left; border-top:1px solid var(--line); padding:22px 0; }
  .venue-card:last-child{border-bottom:1px solid var(--line);}
  .venue-label{font-size:.78rem; color:var(--gold); margin-bottom:6px;}
  .venue-name{font-family:'Cormorant Garamond',serif; font-size:1.5rem; margin:0 0 4px;}
  .venue-addr{font-size:.92rem; color:var(--ink-soft); margin:0 0 12px;}
  .venue-link{font-size:.85rem; color:var(--ink); text-decoration:underline; text-underline-offset:3px;}

  /* ---------- attire ---------- */
  .swatches{display:flex; gap:14px; justify-content:center; margin:22px 0 4px; flex-wrap:wrap;}
  .gallery-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:16px;
  }
  .gallery-grid img{
    width:100%; height:100%; aspect-ratio:1/1; object-fit:cover; border-radius:3px;
    filter: var(--photo-filter, none);
  }
  .gallery-grid a:first-child img, .gallery-grid img:first-child{
    grid-column: span 2; grid-row: span 2; aspect-ratio:1/1;
  }
  .swatch{text-align:center; font-size:.78rem; color:var(--ink-soft);}
  .swatch-dot{width:40px; height:40px; border-radius:50%; margin:0 auto 8px; border:1px solid var(--line);}

  /* ---------- faq ---------- */
  .faq-item{ text-align:left; border-top:1px solid var(--line); padding:18px 0; }
  .faq-item:last-child{border-bottom:1px solid var(--line);}
  .faq-q{font-family:'Cormorant Garamond',serif; font-size:1.2rem; margin:0 0 6px;}
  .faq-a{font-size:.92rem; color:var(--ink-soft); line-height:1.6; margin:0;}

  /* ---------- rsvp form ---------- */
  .field{ text-align:left; margin:16px 0; }
  .field label{ display:block; font-size:.82rem; color:var(--ink-soft); margin-bottom:6px; }
  .field input[type=text], .field input[type=number], .field input[type=email], .field select, .field textarea{
    width:100%; font-family:'Jost',sans-serif; font-size:.96rem; color:var(--ink);
    padding:11px 12px; border:1px solid var(--line); border-radius:2px; background:var(--paper);
  }
  .field textarea{min-height:80px; resize:vertical;}
  .attend-toggle{ display:flex; gap:12px; margin:26px 0; }
  .attend-toggle button{
    flex:1; padding:14px 10px; border:1px solid var(--line); background:var(--paper);
    font-family:'Jost',sans-serif; font-size:.9rem; cursor:pointer; border-radius:2px;
    transition:.2s;
  }
  .attend-toggle button.selected{ border-color:var(--accent-1); background:color-mix(in srgb, var(--accent-1) 12%, transparent); color:var(--ink); }
  #rsvp-error{color:var(--accent-2); font-size:.85rem; min-height:1.2em; margin-top:8px;}
  #rsvp-success{display:none;}

  /* ---------- rsvp: extra color so this section feels inviting, not flat ---------- */
  #stage-rsvp{ position:relative; }
  #stage-rsvp::before{
    content:''; position:absolute; top:0; left:0; right:0; height:6px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-1));
    background-size: 220% 100%;
    animation: rsvpShimmer 7s linear infinite;
  }
  @keyframes rsvpShimmer{ 0%{background-position:0% 0;} 100%{background-position:220% 0;} }
  #stage-rsvp .field input:focus, #stage-rsvp .field select:focus, #stage-rsvp .field textarea:focus{
    outline:none; border-color:var(--accent-1);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-1) 20%, transparent);
  }
  #stage-rsvp .attend-toggle button{ font-weight:500; border-width:1.5px; }
  #stage-rsvp .attend-toggle button[data-attend="yes"].selected{
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    border-color: transparent; color:#fff;
    box-shadow: 0 8px 20px color-mix(in srgb, var(--accent-1) 40%, transparent);
  }
  #stage-rsvp .attend-toggle button[data-attend="no"].selected{
    background: var(--accent-2); border-color:transparent; color:#fff;
    box-shadow: 0 8px 20px color-mix(in srgb, var(--accent-2) 35%, transparent);
  }
  #stage-rsvp button.cta.gold{
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    border-color: transparent; color:#fff;
    box-shadow: 0 10px 26px color-mix(in srgb, var(--accent-2) 38%, transparent);
  }
  #stage-rsvp button.cta.gold:hover{
    background: linear-gradient(135deg, var(--accent-2), var(--accent-1));
    color:#fff; transform: translateY(-1px);
    box-shadow: 0 14px 30px color-mix(in srgb, var(--accent-2) 45%, transparent);
  }
  #rv-honor{ color:var(--accent-2); font-weight:500; }

  /* ---------- door ---------- */
  /* ---------- door (real photo) ---------- */
  #stage-door{
    background:
      radial-gradient(ellipse 120% 80% at 50% 38%, var(--paper) 0%, var(--ivory) 55%, var(--ivory) 100%);
    justify-content:center; align-items:center;
    overflow:hidden;
    padding:18px;
    box-sizing:border-box;
  }
  /* A heavily-blurred, full-bleed wash of the same photo behind the real
     one, so a landscape door photo still reads as "portrait" and fills
     the whole phone screen — without cropping or stretching the actual
     photo. Kept soft and dim on purpose: it is a glow, not a second copy
     of the photo, so it never competes with the sharp photo on top. */
  .door-backdrop{
    position:absolute; inset:-8%;
    width:116%; height:116%;
    object-fit:cover; object-position:center center;
    filter: blur(70px) brightness(.65) saturate(1.3) var(--photo-filter, none);
    transform:scale(1.2);
    opacity:.55;
    transition: opacity .9s ease .15s;
  }
  #stage-door.open .door-backdrop{ opacity:0; }
  /* Vignette + soft fade so the blurred wash reads as an intentional,
     atmospheric glow around the photo rather than a flat band of color. */
  .door-vignette{
    position:absolute; inset:0; pointer-events:none; z-index:1;
    background:
      radial-gradient(ellipse 130% 95% at 50% 46%, transparent 38%, rgba(0,0,0,.4) 100%),
      linear-gradient(to bottom, var(--ivory) 0%, transparent 16%, transparent 84%, var(--ivory) 100%);
    opacity:.85;
    transition: opacity .9s ease .15s;
  }
  #stage-door.open .door-vignette{ opacity:0; }
  .door-photo-wrap{
    position:relative; z-index:2;
    --door-ar: .75; /* width/height — JS sets this to the real image's own ratio once it loads */
    width:min(calc(100vw - 56px), calc((100dvh - 56px) * var(--door-ar)));
    max-height:calc(100dvh - 56px);
    aspect-ratio: var(--door-ar);
    overflow:hidden;
    box-shadow:
      0 0 0 10px var(--paper),
      0 0 0 11px var(--gold-soft),
      0 30px 90px rgba(0,0,0,.4);
    transition: transform 1.1s cubic-bezier(.4,0,.2,1), opacity .9s ease .15s;
  }
  .door-photo{
    position:absolute; inset:0;
    display:block; width:100%; height:100%;
    object-fit:contain; object-position:center center;
    filter: var(--photo-filter, none);
  }
  #stage-door.open .door-photo-wrap{ transform:scale(1.09); opacity:0; }
  /* The arch shape only makes sense for the illustrated designs, where we
     know exactly where the arch sits; an uploaded photo could be of
     anything, so it keeps the plain rounded-card shape above. */
  #stage-door[data-door-mode="illustration"] .scratch-wrap{
    border-radius: 50% 50% 6% 6% / 22% 22% 3% 3%;
  }

  /* Position/size of the scratchable area within whatever is currently
     showing (an illustration or an uploaded photo). Set as CSS custom
     properties by applyDoorCrop() in the script below, which keeps this
     in sync with the canvas crop used to paint the "foil" layer. */
  .scratch-wrap{
    position:absolute; left:var(--scratch-left,3%); top:var(--scratch-top,2%);
    width:var(--scratch-w,94%); height:var(--scratch-h,96%);
    border-radius: 10px; /* a plain card for an arbitrary uploaded photo */
    overflow:hidden;
    box-shadow: 0 2px 14px rgba(46,38,32,.35), inset 0 0 0 1px rgba(180,145,63,.4);
    z-index:5;
  }
  .scratch-under{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 30%, #fff, var(--ivory));
    font-family:'Cormorant Garamond',serif; color:var(--gold); font-size:2.4rem; text-align:center;
  }
  .scratch-under img{width:100%;height:100%;object-fit:cover; filter: var(--photo-filter, none);}
  #scratch-canvas{position:absolute; inset:0; touch-action:none; cursor:pointer; z-index:6;}

  @media (max-width:480px){
    .panel{padding-top:30px;}
    .sched-item{grid-template-columns:64px 1fr;}
  }
  @media (prefers-reduced-motion: reduce){
    .door-photo-wrap, .stage{transition:none !important;}
  }

  .floating-controls{
    position:fixed; bottom:14px; right:16px; z-index:20;
    display:flex; align-items:center; gap:10px;
  }
  .skip-link{
    font-size:.72rem; color:var(--ink-soft);
    opacity:.55; background:none; border:none; cursor:pointer; text-decoration:underline;
  }
  .pill-btn{
    display:flex; align-items:center; justify-content:center;
    min-width:30px; height:26px; padding:0 9px;
    border:1px solid var(--line); border-radius:999px; background:var(--paper);
    color:var(--ink-soft); font-family:'Jost',sans-serif; font-size:.68rem; letter-spacing:.5px;
    opacity:.75; cursor:pointer; transition:.2s;
  }
  .pill-btn:hover{ opacity:1; border-color:var(--gold); }
  .pill-btn[aria-pressed="true"]{ color:var(--gold); border-color:var(--gold); opacity:1; }
</style>
</head>
<body>

<div id="app">

  <!-- CHAPTER 0 — DOOR / OPENING (real photo backdrop) -->
  <section class="stage active" id="stage-door" data-stage="door">
    <img class="door-backdrop" id="door-backdrop" src="photos/door-bg.jpg" alt="" aria-hidden="true">
    <div class="door-vignette" aria-hidden="true"></div>
    <div class="door-photo-wrap" id="door-el">
      <img class="door-photo" src="photos/door-bg.jpg" alt="">
      <div class="scratch-wrap" id="scratch-wrap">
        <div class="scratch-under" id="scratch-under"></div>
        <canvas id="scratch-canvas"></canvas>
      </div>
    </div>
  </section>

  <section class="stage" id="stage-welcome" data-stage="welcome">
    <div class="panel">
      <p class="eyebrow" id="w-eyebrow"></p>
      <div class="frame-photo" id="w-photo"></div>
      <h1 class="names" id="w-names"></h1>
      <p class="lede" style="margin:18px auto 0;" id="w-invite"></p>
      <hr class="rule">
      <p class="date-line" id="w-date"></p>
      <p class="date-line" id="w-loc"></p>

      <div class="countdown" id="countdown" style="display:none;">
        <div class="cd-box"><span class="cd-num" id="cd-days">0</span><span class="cd-label" data-i18n="cd_days">Days</span></div>
        <div class="cd-box"><span class="cd-num" id="cd-hours">0</span><span class="cd-label" data-i18n="cd_hours">Hours</span></div>
        <div class="cd-box"><span class="cd-num" id="cd-mins">0</span><span class="cd-label" data-i18n="cd_mins">Minutes</span></div>
        <div class="cd-box"><span class="cd-num" id="cd-secs">0</span><span class="cd-label" data-i18n="cd_secs">Seconds</span></div>
      </div>

      <a class="venue-link" id="add-calendar" data-i18n="add_calendar" style="display:none; margin-top:14px;">+ Add to calendar</a>

      <div><button class="cta" data-next data-i18n="continue">Continue</button></div>
    </div>
  </section>

  <!-- CHAPTER 2 — CEREMONY -->
  <section class="stage" id="stage-ceremony" data-stage="ceremony">
    <div class="panel">
      <p class="eyebrow" data-i18n="eyebrow_ceremony">The Ceremony</p>
      <h2 class="names" style="font-size:2.1rem;" id="c-name"></h2>
      <p class="lede" id="c-addr" style="margin:6px auto 0;"></p>

          <button type="button" data-attend="yes" id="btn-yes"></button>

        </div>

        <div id="rsvp-extra" style="display:none;">
          <div class="field" id="f-guests-wrap">
            <label for="f-guests" data-i18n="label_guests">Total guests attending (including you)</label>
            <input type="number" id="f-guests" min="1" value="1">
          </div>
          <div class="field" id="f-meal-wrap" style="display:none;">
            <label for="f-meal" data-i18n="label_meal">Main course preference</label>

            <label for="f-song" data-i18n="label_song">A song that would get you on the dance floor</label>
            <input type="text" id="f-song">
          </div>
          <div class="field">
            <label for="f-msg" data-i18n="label_message">Message for the couple (optional)</label>
            <textarea id="f-msg"></textarea>
          </div>
          <button class="cta gold" type="submit" data-i18n="btn_send">Send my reply</button>
        </div>
      </form>
      <p id="rsvp-error"></p>
      <div id="rsvp-success">
        <hr class="rule">
        <p class="lede" style="margin:0 auto;" data-i18n="rsvp_thanks">Thank you. We're so happy to have your reply, and we can't wait to celebrate with you.</p>

<script>
(function(){
  var CFG = window.WEDDING || {};
  var stages = ['door','welcome','ceremony','reception','rsvp'];
  var idx = 0;

  function $(sel, root){ return (root||document).querySelector(sel); }
  function $$(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function fmt(dateStr, opts){
    try{ return new Date(dateStr).toLocaleDateString('en-US', opts); }catch(e){ return dateStr; }
  }

  /* ---------------- English / Tagalog toggle ----------------
     Only translates the site's own fixed interface chrome (buttons,
     labels, the RSVP flow) — not anything the couple typed themselves
     (names, messages, schedule, FAQ), which already shows in whatever
     language they wrote it in. */
  var UI_I18N = {
    en: {
      rv_eyebrow: 'Kindly Reply', eyebrow_ceremony: 'The Ceremony', eyebrow_reception: 'The Reception',
      view_location: 'View location', add_calendar: '+ Add to calendar',
      continue: 'Continue', continue_rsvp: 'Continue to RSVP',
      label_name: 'Your full name', label_guests: 'Total guests attending (including you)',
      label_meal: 'Main course preference', label_song: 'A song that would get you on the dance floor',
      label_message: 'Message for the couple (optional)', btn_send: 'Send my reply',
      rsvp_thanks: "Thank you. We're so happy to have your reply, and we can't wait to celebrate with you.",
      skip_intro: 'Skip intro',
      cd_days: 'Days', cd_hours: 'Hours', cd_mins: 'Minutes', cd_secs: 'Seconds',
      ask: 'Will you be able to join us?', yes_label: "Yes, I'll be there", no_label: "I'm sorry, I can't make it",
      err_attend: 'Please let us know if you can attend.', err_name: 'Please enter your name.',
      err_generic: 'Something went wrong sending your reply. Please try again.',
      err_not_configured: 'RSVP is not fully configured yet — please contact the couple directly.',
      scratch_label: 'S C R A T C H   T O   R E V E A L',
      honor_ninong: "You've been chosen as our Ninong for this special day.",
      honor_ninang: "You've been chosen as our Ninang for this special day.",
      honor_principal: "You've been chosen as one of our Principal Sponsors.",
      honor_secondary: "You've been chosen as one of our Secondary Sponsors.",
      honor_entourage: "You're part of our wedding entourage — thank you for standing with us.",
      music_play: 'Play background music', music_pause: 'Pause background music'
    },
    tl: {
      rv_eyebrow: 'Paki-RSVP', eyebrow_ceremony: 'Ang Kasal', eyebrow_reception: 'Ang Reception',
      view_location: 'Tingnan ang lokasyon', add_calendar: '+ Idagdag sa kalendaryo',
      continue: 'Magpatuloy', continue_rsvp: 'Magpatuloy sa RSVP',
      label_name: 'Buong pangalan mo', label_guests: 'Kabuuang bilang ng dadalo (kasama ka)',
      label_meal: 'Gustong ulam', label_song: 'Kantang magpapasayaw sa iyo',
      label_message: 'Mensahe para sa couple (optional)', btn_send: 'Ipadala ang sagot ko',
      rsvp_thanks: 'Salamat! Natutuwa kami sa sagot mo at sabik na sabik na kaming makasama ka sa araw na ito.',
      skip_intro: 'Laktawan ang intro',
      cd_days: 'Araw', cd_hours: 'Oras', cd_mins: 'Minuto', cd_secs: 'Segundo',
      ask: 'Makakasama ka ba namin?', yes_label: 'Oo, dadalo ako', no_label: 'Paumanhin, hindi ako makakadalo',
      err_attend: 'Paki-sagot muna kung dadalo ka o hindi.', err_name: 'Pakilagay ang iyong pangalan.',
      err_generic: 'May error sa pagpapadala ng sagot mo. Pakisubukan muli.',
      err_not_configured: 'Hindi pa handa ang RSVP — pakikontak na lang ang couple nang direkta.',
      scratch_label: 'K I S K I S I N   P A R A   M A K I T A',
      honor_ninong: 'Ikaw ang napiling maging Ninong namin sa araw na ito.',
      honor_ninang: 'Ikaw ang napiling maging Ninang namin sa araw na ito.',
      honor_principal: 'Ikaw ay isa sa aming mga Principal Sponsor.',
      honor_secondary: 'Ikaw ay isa sa aming mga Secondary Sponsor.',
      honor_entourage: 'Bahagi ka ng aming entourage — maraming salamat sa pagsama sa amin.',
      music_play: 'I-play ang musika', music_pause: 'I-pause ang musika'
    }
  };
  var currentLang = 'en';
  try{ var savedLang = localStorage.getItem('weddingLang'); if(savedLang === 'tl') currentLang = 'tl'; }catch(e){}
  function t(key){
    var d = UI_I18N[currentLang] || UI_I18N.en;
    return (d && d[key] != null) ? d[key] : (UI_I18N.en[key] || key);
  }
  function applyLanguage(lang){
    currentLang = (lang === 'tl') ? 'tl' : 'en';
    try{ localStorage.setItem('weddingLang', currentLang); }catch(e){}
    $$('[data-i18n]').forEach(function(el){ el.textContent = t(el.getAttribute('data-i18n')); });
    ASK = t('ask'); YES_LABEL = t('yes_label'); NO_LABEL = t('no_label');
    ROLE_TEXT = {
      ninong: { honor: t('honor_ninong') }, ninang: { honor: t('honor_ninang') },
      'principal-sponsor': { honor: t('honor_principal') }, 'secondary-sponsor': { honor: t('honor_secondary') },
      entourage: { honor: t('honor_entourage') }, family: { honor: '' }, guest: { honor: '' }
    };
    var langBtn = $('#lang-toggle'); if(langBtn) langBtn.textContent = currentLang === 'en' ? 'TL' : 'EN';
    var musicBtn = $('#music-toggle');
    if(musicBtn){ musicBtn.setAttribute('aria-label', t(musicBtn.getAttribute('aria-pressed') === 'true' ? 'music_pause' : 'music_play')); }
    if($('#rsvp-error')) $('#rsvp-error').textContent = '';
    if(typeof setupAddToCalendar === 'function') setupAddToCalendar();
    if(typeof updateRsvpQuestion === 'function') updateRsvpQuestion();
    if(typeof sizeCanvas === 'function') sizeCanvas(true);
  }

  /* ---------------- door artwork (no photo required) ----------------
     Several elegant, portrait-native "door" covers drawn as vector SVG —
     colored to match whichever theme is active, and personalized with the
     couple's own initials/names/date automatically. Chosen via
     CFG.doorStyle; set it to "photo" to use CFG.doorPhoto instead. */
  var DOOR_ART_BOX = { x:160, y:70, w:430, h:840 }; // shared "door" bounding box inside the 750x1000 canvas

  function doorThemeColors(){
    function v(name, fallback){
      try{ var c = getComputedStyle(document.body).getPropertyValue(name).trim(); return c || fallback; }catch(e){ return fallback; }
    }
    return {
      ink: v('--ink','#2E2620'), gold: v('--gold','#B4913F'), goldSoft: v('--gold-soft','#DCC98F'),
      paper: v('--paper','#FBF8F1'), ivory: v('--ivory','#F5EFE2'), rose: v('--rose','#A8756A'), pine: v('--pine','#33413A')
    };
  }
  function xmlesc(s){
    return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
  }
  function doorArchPath(ax,ay,aw,ah){
    var ar=aw/2, cx=ax+ar, ct=ay+ar;
    return 'M'+ax+','+(ay+ah)+' L'+ax+','+ct+' A'+ar+','+ar+' 0 0 1 '+(ax+aw)+','+ct+' L'+(ax+aw)+','+(ay+ah)+' Z';
  }
  function doorMeta(){
    var p1 = CFG.partner1 || 'Jhau', p2 = CFG.partner2 || 'Sheila';
    var dateStr = '';
    try{ dateStr = CFG.date ? new Date(CFG.date).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) : ''; }catch(e){}
    var m = doorThemeColors();
    m.initials = ((p1[0]||'J') + (p2[0]||'S')).toUpperCase();
    m.p1 = p1; m.p2 = p2; m.dateStr = dateStr;
    return m;
  }

  // Faint dot texture behind every design, so the paper never reads as a
  // flat block of color even where there's no ornament.
  function bgFill(m){
    return '<defs><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">'+
      '<circle cx="13" cy="13" r="1.4" fill="'+m.gold+'" opacity=".16"/></pattern></defs>'+
      '<rect width="750" height="1000" fill="'+m.ivory+'"/>'+
      '<rect width="750" height="1000" fill="url(#dots)"/>';
  }

  function buildFloralArch(m){
    var b=DOOR_ART_BOX, ar=b.w/2, cx=b.x+ar, ct=b.y+ar;
    var outer = doorArchPath(b.x,b.y,b.w,b.h);
    var inner = doorArchPath(b.x+12,b.y+12,b.w-24,b.h-24);
    // Garland sits just inside the arch's own curve (gR < ar) so nothing
    // it draws can land above DOOR_ART_BOX's top edge and get clipped by
    // the scratch mask, which only shows the box itself.
    var gR = ar-30, n=11, garland='';
    for(var i=0;i<n;i++){
      var t = Math.PI*(0.06+0.88*(i/(n-1)));
      var bx = cx - gR*Math.cos(t), by = ct - gR*Math.sin(t);
      var r = 7 + (i%3===0?4:0);
      var fill = (i%3===0) ? m.rose : (i%2===0 ? m.goldSoft : m.paper);
      garland += '<g transform="translate('+bx.toFixed(1)+','+by.toFixed(1)+')"><circle r="'+r+'" fill="'+fill+'" stroke="'+m.gold+'" stroke-width="1"/><circle cx="'+(r*.9).toFixed(1)+'" r="'+(r*.55).toFixed(1)+'" fill="'+fill+'" opacity=".85"/><circle cx="'+(-r*.9).toFixed(1)+'" r="'+(r*.55).toFixed(1)+'" fill="'+fill+'" opacity=".85"/><circle cy="'+(-r*.9).toFixed(1)+'" r="'+(r*.5).toFixed(1)+'" fill="'+fill+'" opacity=".8"/></g>';
      if(i<n-1){
        var t2 = Math.PI*(0.06+0.88*((i+.5)/(n-1)));
        var lx = cx - (gR-14)*Math.cos(t2), ly = ct - (gR-14)*Math.sin(t2);
        var rot = (-(t2*180/Math.PI)+90);
        garland += '<ellipse cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" rx="11" ry="4.5" fill="'+m.pine+'" opacity=".55" transform="rotate('+rot.toFixed(1)+' '+lx.toFixed(1)+' '+ly.toFixed(1)+')"/>';
      }
    }
    // A second, finer scatter of small dots tracing just outside the garland.
    var sparkle='';
    for(var j=0;j<14;j++){
      var ts = Math.PI*(0.04+0.92*(j/13));
      var sx = cx - (gR+16)*Math.cos(ts), sy = ct - (gR+16)*Math.sin(ts);
      sparkle += '<circle cx="'+sx.toFixed(1)+'" cy="'+sy.toFixed(1)+'" r="1.6" fill="'+m.gold+'" opacity=".5"/>';
    }
    return bgFill(m)+
      '<path d="'+outer+'" fill="'+m.paper+'" stroke="'+m.gold+'" stroke-width="3"/>'+
      '<path d="'+inner+'" fill="none" stroke="'+m.goldSoft+'" stroke-width="1"/>'+
      sparkle+garland+
      '<text x="'+cx+'" y="'+(ct+40)+'" text-anchor="middle" font-family="&apos;Cormorant Garamond&apos;,serif" font-size="92" fill="'+m.gold+'" letter-spacing="4">'+xmlesc(m.initials)+'</text>'+
      '<path d="M'+(cx-70)+' '+(ct+78)+' L'+(cx-14)+' '+(ct+78)+' M'+(cx+14)+' '+(ct+78)+' L'+(cx+70)+' '+(ct+78)+'" stroke="'+m.gold+'" stroke-width="1.4"/>'+
      '<circle cx="'+cx+'" cy="'+(ct+78)+'" r="3" fill="'+m.gold+'"/>'+
      '<text x="'+cx+'" y="'+(ct+120)+'" text-anchor="middle" font-family="Jost,sans-serif" font-size="19" letter-spacing="3" fill="'+m.ink+'">'+xmlesc((m.p1+' & '+m.p2).toUpperCase())+'</text>'+
      (m.dateStr ? ('<text x="'+cx+'" y="'+(ct+152)+'" text-anchor="middle" font-family="Jost,sans-serif" font-size="15" letter-spacing="2" fill="'+m.ink+'" opacity=".75">'+xmlesc(m.dateStr)+'</text>') : '');
  }

  function buildArtDeco(m){
    var b=DOOR_ART_BOX, cx=b.x+b.w/2;
    function fan(cy,startDeg,endDeg,rI,rO,count,sw,op){
      var s='';
      for(var i=0;i<count;i++){
        var t = startDeg + (endDeg-startDeg)*(i/(count-1));
        var rad = t*Math.PI/180;
        var x1=cx+rI*Math.cos(rad), y1=cy+rI*Math.sin(rad);
        var x2=cx+rO*Math.cos(rad), y2=cy+rO*Math.sin(rad);
        s += '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+m.gold+'" stroke-width="'+sw+'" opacity="'+op+'"/>';
      }
      return s;
    }
    function diamond(x,y,s){
      return '<path d="M'+x+' '+(y-s)+' L'+(x+s)+' '+y+' L'+x+' '+(y+s)+' L'+(x-s)+' '+y+' Z" fill="none" stroke="'+m.gold+'" stroke-width="1.6"/>';
    }
    return bgFill(m)+
      '<rect x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.h+'" fill="'+m.paper+'" stroke="'+m.gold+'" stroke-width="3"/>'+
      '<rect x="'+(b.x+12)+'" y="'+(b.y+12)+'" width="'+(b.w-24)+'" height="'+(b.h-24)+'" fill="none" stroke="'+m.goldSoft+'" stroke-width="1"/>'+
      fan(b.y+80,15,165,14,88,17,1.1,.5)+
      fan(b.y+80,20,160,10,64,13,1.4,1)+
      diamond(cx,b.y+80,7)+
      fan(b.y+b.h-80,195,345,12,74,15,1.1,.5)+
      fan(b.y+b.h-80,200,340,8,50,11,1.4,1)+
      diamond(cx,b.y+b.h-80,6)+
      '<text x="'+cx+'" y="505" text-anchor="middle" font-family="Jost,sans-serif" font-weight="600" font-size="86" letter-spacing="10" fill="'+m.gold+'">'+xmlesc(m.initials)+'</text>'+
      '<path d="M'+(cx-60)+' 545 L'+(cx-16)+' 545 M'+(cx+16)+' 545 L'+(cx+60)+' 545" stroke="'+m.gold+'" stroke-width="1.4"/>'+
      diamond(cx,545,6)+
      '<text x="'+cx+'" y="608" text-anchor="middle" font-family="Jost,sans-serif" font-size="18" letter-spacing="4" fill="'+m.ink+'">'+xmlesc((m.p1+' & '+m.p2).toUpperCase())+'</text>'+
      (m.dateStr ? ('<text x="'+cx+'" y="642" text-anchor="middle" font-family="Jost,sans-serif" font-size="14" letter-spacing="2" fill="'+m.ink+'" opacity=".75">'+xmlesc(m.dateStr)+'</text>') : '');
  }

  function buildBotanical(m){
    var b=DOOR_ART_BOX, cx=b.x+b.w/2, cy=b.y+b.h*0.4, R=148;
    var leaves='', beads='', n=8;
    for(var i=0;i<n;i++){
      var frac = i/(n-1);
      var ang = Math.PI*(0.58 + 0.36*frac);
      var dist = R+8+i*8;
      var lx = cx - dist*Math.cos(ang), ly = cy + dist*Math.sin(ang);
      var rot = (ang*180/Math.PI)+90;
      leaves += '<ellipse cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" rx="13" ry="5" fill="'+m.pine+'" opacity=".6" transform="rotate('+rot.toFixed(1)+' '+lx.toFixed(1)+' '+ly.toFixed(1)+')"/>';
      var rx2 = cx + dist*Math.cos(ang), ry2 = cy + dist*Math.sin(ang);
      leaves += '<ellipse cx="'+rx2.toFixed(1)+'" cy="'+ry2.toFixed(1)+'" rx="13" ry="5" fill="'+m.pine+'" opacity=".6" transform="rotate('+(-rot).toFixed(1)+' '+rx2.toFixed(1)+' '+ry2.toFixed(1)+')"/>';
    }
    for(var k=0;k<24;k++){
      var ba = (k/24)*Math.PI*2;
      var bx2 = cx + (R+20)*Math.cos(ba), by2 = cy + (R+20)*Math.sin(ba);
      beads += '<circle cx="'+bx2.toFixed(1)+'" cy="'+by2.toFixed(1)+'" r="1.8" fill="'+m.goldSoft+'" opacity=".7"/>';
    }
    return bgFill(m)+
      '<rect x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.h+'" fill="'+m.paper+'"/>'+
      '<rect x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.h+'" fill="none" stroke="'+m.goldSoft+'" stroke-width="1"/>'+
      beads+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="'+m.gold+'" stroke-width="2.5"/>'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R-10)+'" fill="none" stroke="'+m.goldSoft+'" stroke-width="1"/>'+
      leaves+
      '<text x="'+cx+'" y="'+(cy+32)+'" text-anchor="middle" font-family="&apos;Cormorant Garamond&apos;,serif" font-size="84" fill="'+m.gold+'">'+xmlesc(m.initials)+'</text>'+
      '<text x="'+cx+'" y="'+(cy+R+76)+'" text-anchor="middle" font-family="Jost,sans-serif" font-size="19" letter-spacing="3" fill="'+m.ink+'">'+xmlesc((m.p1+' & '+m.p2).toUpperCase())+'</text>'+
      (m.dateStr ? ('<text x="'+cx+'" y="'+(cy+R+108)+'" text-anchor="middle" font-family="Jost,sans-serif" font-size="15" letter-spacing="2" fill="'+m.ink+'" opacity=".75">'+xmlesc(m.dateStr)+'</text>') : '');
  }

  function buildClassicFrame(m){
    var b=DOOR_ART_BOX, cx=b.x+b.w/2;
    var cTL = '<path d="M'+b.x+' '+(b.y+46)+' L'+b.x+' '+b.y+' L'+(b.x+46)+' '+b.y+'" fill="none" stroke="'+m.gold+'" stroke-width="2.2"/>';
    var cTR = '<path d="M'+(b.x+b.w-46)+' '+b.y+' L'+(b.x+b.w)+' '+b.y+' L'+(b.x+b.w)+' '+(b.y+46)+'" fill="none" stroke="'+m.gold+'" stroke-width="2.2"/>';
    var cBL = '<path d="M'+b.x+' '+(b.y+b.h-46)+' L'+b.x+' '+(b.y+b.h)+' L'+(b.x+46)+' '+(b.y+b.h)+'" fill="none" stroke="'+m.gold+'" stroke-width="2.2"/>';
    var cBR = '<path d="M'+(b.x+b.w-46)+' '+(b.y+b.h)+' L'+(b.x+b.w)+' '+(b.y+b.h)+' L'+(b.x+b.w)+' '+(b.y+b.h-46)+'" fill="none" stroke="'+m.gold+'" stroke-width="2.2"/>';
    // A fine dotted border tracing just inside the panel's own edge.
    var dots='', per=2*(b.w-40)+2*(b.h-40), step=18, steps=Math.floor(per/step);
    for(var i=0;i<steps;i++){
      var d = (i*step)%per, px, py;
      var w2=b.w-40, h2=b.h-40, x0=b.x+20, y0=b.y+20;
      if(d < w2){ px=x0+d; py=y0; }
      else if(d < w2+h2){ px=x0+w2; py=y0+(d-w2); }
      else if(d < 2*w2+h2){ px=x0+w2-(d-w2-h2); py=y0+h2; }
      else { px=x0; py=y0+h2-(d-2*w2-h2); }
      dots += '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="1.4" fill="'+m.goldSoft+'" opacity=".8"/>';
    }
    function sideDiamond(x,y){
      return '<path d="M'+x+' '+(y-8)+' L'+(x+8)+' '+y+' L'+x+' '+(y+8)+' L'+(x-8)+' '+y+' Z" fill="'+m.gold+'"/>';
    }
    return bgFill(m)+
      '<rect x="'+b.x+'" y="'+b.y+'" width="'+b.w+'" height="'+b.h+'" fill="'+m.paper+'" stroke="'+m.goldSoft+'" stroke-width="1"/>'+
      dots+cTL+cTR+cBL+cBR+
      sideDiamond(b.x+16,b.y+b.h/2)+sideDiamond(b.x+b.w-16,b.y+b.h/2)+
      '<text x="'+cx+'" y="'+(b.y+150)+'" text-anchor="middle" font-family="Jost,sans-serif" font-size="16" letter-spacing="5" fill="'+m.ink+'" opacity=".75">THE WEDDING OF</text>'+
      '<text x="'+cx+'" y="'+(b.y+330)+'" text-anchor="middle" font-family="&apos;Cormorant Garamond&apos;,serif" font-style="italic" font-size="64" fill="'+m.ink+'">'+xmlesc(m.p1)+'</text>'+
      '<text x="'+cx+'" y="'+(b.y+400)+'" text-anchor="middle" font-family="&apos;Cormorant Garamond&apos;,serif" font-size="30" fill="'+m.gold+'">&amp;</text>'+
      '<text x="'+cx+'" y="'+(b.y+475)+'" text-anchor="middle" font-family="&apos;Cormorant Garamond&apos;,serif" font-style="italic" font-size="64" fill="'+m.ink+'">'+xmlesc(m.p2)+'</text>'+
      '<path d="M'+(cx-80)+' '+(b.y+520)+' L'+(cx-14)+' '+(b.y+520)+' M'+(cx+14)+' '+(b.y+520)+' L'+(cx+80)+' '+(b.y+520)+'" stroke="'+m.gold+'" stroke-width="1.4"/>'+

  var DOOR_STYLES = {
    'floral-arch':    { build: buildFloralArch },

    'botanical-ring': { build: buildBotanical },
    'classic-frame':  { build: buildClassicFrame }

  function buildDoorIllustrationSrc(styleKey){
    var style = DOOR_STYLES[styleKey] || DOOR_STYLES['floral-arch'];
    var inner = style.build(doorMeta());
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1000" viewBox="0 0 750 1000">'+inner+'</svg>';
    return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);

  // Crop fractions shared by the scratch-wrap CSS (as custom properties,
  // set below) and the canvas foil painter further down, so the two
  // always agree on where the "door" sits within whatever is showing.
  // PHOTO_CROP is deliberately near-full-frame (not a hand-picked sub
  // region) so an uploaded photo — which could be of anything, not
  // necessarily an arched door — always lines up exactly with itself
  // instead of a crop rectangle calibrated to one specific sample photo.
  var PHOTO_CROP = { x:.03, y:.02, w:.94, h:.96 };
  var ILLUSTRATION_CROP = { x: DOOR_ART_BOX.x/750, y: DOOR_ART_BOX.y/1000, w: DOOR_ART_BOX.w/750, h: DOOR_ART_BOX.h/1000 };
  var DOOR_CROP = PHOTO_CROP;

  function applyDoorCrop(mode){
    DOOR_CROP = (mode === 'illustration') ? ILLUSTRATION_CROP : PHOTO_CROP;
    var stage = $('#stage-door');
    stage.setAttribute('data-door-mode', mode);
    stage.style.setProperty('--scratch-left', (DOOR_CROP.x*100)+'%');
    stage.style.setProperty('--scratch-top', (DOOR_CROP.y*100)+'%');
    stage.style.setProperty('--scratch-w', (DOOR_CROP.w*100)+'%');
    stage.style.setProperty('--scratch-h', (DOOR_CROP.h*100)+'%');

  /* ---------------- countdown + add-to-calendar ---------------- */
  var countdownTimer = null;
  function setupCountdown(){
    var el = $('#countdown');
    if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
    var target = CFG.date ? new Date(CFG.date).getTime() : NaN;
    if(!target || isNaN(target)){ el.style.display='none'; return; }
    function tick(){
      var diff = target - Date.now();
      if(diff <= 0){
        el.style.display='none';
        if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; }
        return;
      }
      el.style.display='flex';
      $('#cd-days').textContent = Math.floor(diff/86400000);
      $('#cd-hours').textContent = Math.floor((diff%86400000)/3600000);
      $('#cd-mins').textContent = Math.floor((diff%3600000)/60000);
      $('#cd-secs').textContent = Math.floor((diff%60000)/1000);
    }
    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  function setupAddToCalendar(){
    var a = $('#add-calendar');

    var end = (CFG.dateEnd && !isNaN(new Date(CFG.dateEnd).getTime())) ? new Date(CFG.dateEnd) : new Date(start.getTime() + 4*3600000);
    function pad(n){ return (n<10?'0':'')+n; }
    function toICSDate(d){
      return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';
    }
    function esc(s){ return String(s||'').replace(/[\\,;]/g, function(c){ return '\\'+c; }).replace(/\n/g,'\\n'); }
    var venues = CFG.venues || [];
    var ceremony = venues[0] || {};

  /* ---------------- door / chapter transitions ---------------- */

  /* ---------------- scratch-to-reveal ---------------- */
  var canvas = $('#scratch-canvas');
  var ctx = canvas.getContext('2d');
  var scratchWrap = $('#scratch-wrap');
  var doorImgEl = $('.door-photo');
  var revealed = false;
  var canvasW = 0, canvasH = 0;
  // DOOR_CROP is set above by applyDoorCrop() and kept in sync with the
  // .scratch-wrap CSS custom properties, for both illustration and photo modes.

  function drawFoil(){
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);

    // Paint the same slice of the real door photo here, so before scratching
    // it looks like the closed door itself — not a sticker covering it.
    if(doorImgEl && doorImgEl.complete && doorImgEl.naturalWidth){
      var nw = doorImgEl.naturalWidth, nh = doorImgEl.naturalHeight;
      try{
        var pf = getComputedStyle(document.body).getPropertyValue('--photo-filter').trim();
        ctx.filter = pf || 'none';
      }catch(e){}
      ctx.drawImage(doorImgEl, nw*DOOR_CROP.x, nh*DOOR_CROP.y, nw*DOOR_CROP.w, nh*DOOR_CROP.h, 0, 0, w, h);
      ctx.filter = 'none';
    } else {
      var g = ctx.createLinearGradient(0,0,0,h);
      g.addColorStop(0, '#F7F0E1');
      g.addColorStop(1, '#EDE1C7');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,w,h);
    }

    // Darken the lower third so the label reads — a stronger band than
    // before, since this now sits over any illustration or photo (light
    // backgrounds included), not just one pre-tested dark door photo.
    var vg = ctx.createLinearGradient(0, h*0.56, 0, h);
    vg.addColorStop(0, 'rgba(18,13,8,0)');
    vg.addColorStop(0.45, 'rgba(18,13,8,.45)');
    vg.addColorStop(1, 'rgba(18,13,8,.78)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, h*0.5, w, h*0.5);

    // A solid plaque directly behind the label guarantees contrast no
    // matter how light or busy whatever is underneath is.
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    var fontSize = Math.max(12, Math.round(h*0.042));
    ctx.font = '600 '+fontSize+'px "Cormorant Garamond", serif';
    var label = t('scratch_label');
    var labelY = h*0.84;
    var textW = ctx.measureText(label).width;
    var padX = fontSize*0.9, padY = fontSize*0.62;
    var plaqueW = Math.min(w*0.86, textW + padX*2);
    var plaqueH = fontSize + padY*2;
    ctx.fillStyle = 'rgba(16,12,8,.55)';
    roundRect(ctx, w/2 - plaqueW/2, labelY - plaqueH/2, plaqueW, plaqueH, plaqueH/2);
    ctx.fill();

    ctx.fillStyle = '#FFFCF6';
    ctx.shadowColor = 'rgba(0,0,0,.5)';
    ctx.shadowBlur = Math.round(h*0.015);
    ctx.fillText(label, w/2, labelY, plaqueW - padX*1.2);
    ctx.shadowBlur = 0;
    ctx.textBaseline = 'alphabetic';
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function sizeCanvas(force){
    var r = scratchWrap.getBoundingClientRect();
    var w = Math.round(r.width), h = Math.round(r.height);
    if(!force && Math.abs(w-canvasW) < 4 && Math.abs(h-canvasH) < 4) return; // ignore trivial mobile viewport jitter
    if(revealed) return; // never redraw over an already-revealed photo
    canvasW = w; canvasH = h;
    canvas.width = w; canvas.height = h;
    drawFoil();
  }
  sizeCanvas(true);
  if(doorImgEl){ doorImgEl.addEventListener('load', function(){ sizeCanvas(true); }); }
  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ sizeCanvas(false); }, 300);
  });

  function pos(e){
    var r = canvas.getBoundingClientRect();
    var p = e.touches ? e.touches[0] : e;
    return {x: p.clientX - r.left, y: p.clientY - r.top};
  }
  var lastPt = null;
  var scratchedLength = 0;
  var revealThreshold = 0; // computed once canvas is sized
  function scratchTo(x,y){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(0,0,0,1)';
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.lineWidth = 62 + Math.random()*14;
    ctx.beginPath();
    if(lastPt){
      ctx.moveTo(lastPt.x, lastPt.y);
      scratchedLength += Math.hypot(x-lastPt.x, y-lastPt.y);
    } else {
      ctx.moveTo(x-0.1,y-0.1);
    }
    ctx.lineTo(x,y);
    ctx.stroke();
    lastPt = {x:x,y:y};
  }
  function checkReveal(){
    if(revealed) return;
    if(!revealThreshold){
      // enough total scratch distance to reasonably cover the panel a few times over
      revealThreshold = (canvas.width + canvas.height) * 2.6;
    }
    if(scratchedLength > revealThreshold){
      triggerReveal();
    }
  }

  function triggerReveal(){
    if(revealed) return;
    revealed = true;
    clearTimeout(watchdogTimer);
    canvas.style.transition='opacity .6s ease';
    canvas.style.opacity='0';
    setTimeout(function(){ scratchWrap.style.display = 'none'; }, 650);
    advanceThroughDoor();
  }

  function advanceThroughDoor(){
    try{
      door.classList.add('open');
      setTimeout(function(){
        goTo('welcome');
      }, 1150);
    }catch(err){
      // safety net: never leave the guest stranded on the door
      goTo('welcome');
    }
  }

  // second safety net: if the guest is clearly trying (has been actively
  // scratching for a while) but something about the browser prevents the
  // normal detection from firing, open the door anyway rather than trap them.
  var watchdogTimer = null;
  function armWatchdog(){
    if(watchdogTimer || revealed) return;
    watchdogTimer = setTimeout(function(){ triggerReveal(); }, 7000);
  }

  var drawing=false;
  function start(e){ drawing=true; lastPt=null; armWatchdog(); var p=pos(e); scratchTo(p.x,p.y); checkReveal(); e.preventDefault(); }
  function move(e){ if(!drawing) return; var p=pos(e); scratchTo(p.x,p.y); checkReveal(); e.preventDefault(); }
  function end(){ drawing=false; lastPt=null; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);

  /* ---------------- RSVP form ---------------- */
  var ROLE_TEXT = {
    ninong: { honor: "You've been chosen as our Ninong for this special day." },
    ninang: { honor: "You've been chosen as our Ninang for this special day." },
    'principal-sponsor': { honor: "You've been chosen as one of our Principal Sponsors." },
    'secondary-sponsor': { honor: "You've been chosen as one of our Secondary Sponsors." },
    entourage: { honor: "You're part of our wedding entourage — thank you for standing with us." },
    family: { honor: "" },
    guest: { honor: "" }
  };
  var ASK = 'Will you be able to join us?';
  var YES_LABEL = "Yes, I'll be there";
  var NO_LABEL = "I'm sorry, I can't make it";

  function normalizeName(s){ return (s||'').toLowerCase().trim().replace(/\s+/g,' '); }
  function findGuest(input){
    var n = normalizeName(input);
    if(!n || n.length < 2) return null;
    var list = CFG.guestList || [];
    for(var i=0;i<list.length;i++){
      if(normalizeName(list[i].name) === n) return list[i];
    }
    for(var i=0;i<list.length;i++){
      var ln = normalizeName(list[i].name);
      if(ln.indexOf(n) !== -1 || n.indexOf(ln) !== -1) return list[i];
    }
    return null;
  }

  function updateRsvpQuestion(){
    var nameVal = $('#f-name').value.trim();
    var honorEl = $('#rv-honor'), qEl = $('#rv-question'), toggleEl = $('#attend-toggle');
    if(nameVal.length < 2){
      honorEl.style.display='none';
      qEl.style.display='none';
      toggleEl.style.display='none';
      return;
    }
    var guest = findGuest(nameVal);
    var role = guest ? guest.role : 'guest';
    currentGuestRole = role;
    var rt = ROLE_TEXT[role] || ROLE_TEXT.guest;
    var firstName = nameVal.split(' ')[0];

    if(rt.honor){
      honorEl.textContent = firstName + ' — ' + rt.honor;
      honorEl.style.display='block';
    } else {
      honorEl.style.display='none';
    }

    qEl.textContent = guest ? (firstName + ', ' + ASK.charAt(0).toLowerCase() + ASK.slice(1)) : ASK;
    qEl.style.display='block';
    toggleEl.style.display='flex';
    $('#btn-yes').textContent = YES_LABEL;
    $('#btn-no').textContent = NO_LABEL;
  }
  $('#f-name').addEventListener('input', updateRsvpQuestion);

  var attend = null;
  var currentGuestRole = '';
  $('#btn-yes').addEventListener('click', function(){ attend='yes'; setAttend(); });
  $('#btn-no').addEventListener('click', function(){ attend='no'; setAttend(); });
  function setAttend(){
    $('#btn-yes').classList.toggle('selected', attend==='yes');
    $('#btn-no').classList.toggle('selected', attend==='no');
    $('#rsvp-extra').style.display='block';
    $('#f-guests-wrap').style.display = attend==='yes' ? 'block' : 'none';
    $('#f-meal-wrap').style.display = (attend==='yes' && (CFG.rsvp&&CFG.rsvp.mealOptions&&CFG.rsvp.mealOptions.length)) ? 'block':'none';
    $('#f-song-wrap').style.display = (attend==='yes' && CFG.rsvp && CFG.rsvp.askSongRequest) ? 'block':'none';
  }

  $('#rsvp-form').addEventListener('submit', function(e){
    e.preventDefault();
    var err = $('#rsvp-error'); err.textContent='';
    if(!attend){ err.textContent=t('err_attend'); return; }
    var name = $('#f-name').value.trim();
    if(!name){ err.textContent=t('err_name'); return; }

    var payload = {
      name: name,
      role: currentGuestRole || 'guest',
      attending: attend,
      guests: attend==='yes' ? ($('#f-guests').value||1) : 0,
      meal: $('#f-meal') && $('#f-meal').value || '',
      song: $('#f-song').value || '',
      message: $('#f-msg').value || ''
    };

    var rsvp = CFG.rsvp || {};
    if(rsvp.mode === 'email' && rsvp.email){
      var subject = encodeURIComponent('RSVP — ' + name);
      var body = encodeURIComponent(
        'Name: '+payload.name+'\n'+
        'Attending: '+(payload.attending==='yes'?'Yes':'No')+'\n'+
        (payload.attending==='yes' ? 'Guests: '+payload.guests+'\n' : '') +
        (payload.meal ? 'Meal: '+payload.meal+'\n' : '') +
        (payload.song ? 'Song request: '+payload.song+'\n' : '') +
        (payload.message ? 'Message: '+payload.message+'\n' : '')
      );
      window.location.href = 'mailto:'+rsvp.email+'?subject='+subject+'&body='+body;
      showSuccess();
    } else if(rsvp.mode === 'webhook' && rsvp.webhookUrl){
      fetch(rsvp.webhookUrl, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)})
        .then(function(){ showSuccess(); })
        .catch(function(){ err.textContent = t('err_generic'); });
    } else if(rsvp.mode === 'supabase' && rsvp.supabase && rsvp.supabase.url){
      fetch(rsvp.supabase.url+'/rest/v1/'+(rsvp.supabase.table||'rsvps'), {
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':rsvp.supabase.anonKey,'Authorization':'Bearer '+rsvp.supabase.anonKey,'Prefer':'return=minimal'},
        body: JSON.stringify(payload)
      }).then(function(){ showSuccess(); })
        .catch(function(){ err.textContent = t('err_generic'); });
    } else {
      err.textContent = t('err_not_configured');
    }
  });

  function showSuccess(){
    $('#rsvp-form').style.display='none';
    $('#rsvp-success').style.display='block';
  }

  applyLanguage(currentLang);

  }catch(setupErr){
    // even if the interactive bits fail to wire up, the content above has
    // already been populated and the "Skip intro" link still works.
  }
})();
</script>
</body>
</html>
