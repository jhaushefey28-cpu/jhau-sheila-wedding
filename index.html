<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jhau &amp; Sheila — December 27, 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root{
    --ivory:#F7F1E6;
    --paper:#FFFCF6;
    --ink:#2E2620;
    --ink-soft:#5B5147;
    --gold:#B4913F;
    --gold-soft:#DCC98F;
    --pine:#33413A;
    --rose:#A8756A;
    --line: rgba(46,38,32,0.14);
    --shadow: 0 20px 60px rgba(46,38,32,0.16);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *,*::before,*::after{box-sizing:inherit;}
  body[data-theme="romantic-blush"]{
    --ivory:#F7E9E6; --paper:#FFF8F6; --ink:#3A2430; --ink-soft:#6E5560;
    --gold:#C08A6B; --gold-soft:#E8C7B8; --pine:#7A4E5A; --rose:#B85C6B;
  }
  body[data-theme="emerald-gold"]{
    --ivory:#EDE7D9; --paper:#F7F3E8; --ink:#1F2B22; --ink-soft:#48584B;
    --gold:#C9A24A; --gold-soft:#E2CD93; --pine:#12321F; --rose:#8E6A3D;
  }
  body[data-theme="midnight-elegance"]{
    --ivory:#171512; --paper:#211E1A; --ink:#F3ECDD; --ink-soft:#C7BBA4;
    --gold:#D4B45F; --gold-soft:#8A733B; --pine:#0E1310; --rose:#B98072;
    --line: rgba(243,236,221,0.14);
  }
  html{scroll-behavior:smooth; scroll-padding-top: env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ivory);
    color:var(--ink);
    font-family:'Jost',sans-serif;
    font-weight:400;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Cormorant Garamond', serif; font-weight:500; letter-spacing:.01em;}
  .lede{color:var(--ink-soft); font-size:1.02rem; line-height:1.7; max-width:38ch;}

  /* ---------- app shell ---------- */
  #app{position:relative; width:100%; height:100vh; height:100dvh; overflow:hidden;}

  .stage{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .5s ease;
  }
  .stage.active{opacity:1; pointer-events:auto;}

  .panel{
    width:min(560px, 88vw);
    max-height:82vh;
    overflow-y:auto;
    padding: 44px 8px;
    text-align:center;
  }
  .panel::-webkit-scrollbar{width:5px;}
  .panel::-webkit-scrollbar-thumb{background:var(--line); border-radius:10px;}

  .eyebrow{
    font-family:'Jost',sans-serif;
    font-size:.78rem;
    color:var(--gold);
    letter-spacing:.04em;
    margin:0 0 14px;
  }
  .rule{
    width:56px; height:1px; background:var(--gold);
    margin:22px auto;
    border:none;
  }
  .names{font-size:clamp(2.4rem, 7vw, 3.6rem); margin:0 0 8px; line-height:1.05;}
  .amp{color:var(--rose); font-style:italic;}
  .date-line{font-size:1.1rem; color:var(--ink-soft); margin:6px 0 0;}

  button.cta{
    appearance:none; border:1px solid var(--ink);
    background:transparent; color:var(--ink);
    font-family:'Jost',sans-serif; font-size:.92rem; letter-spacing:.02em;
    padding:13px 34px; border-radius:2px;
    cursor:pointer; margin-top:30px;
    transition: background .25s ease, color .25s ease, border-color .25s ease;
  }
  button.cta:hover{background:var(--ink); color:var(--paper);}
  button.cta.gold{border-color:var(--gold); color:var(--gold);}
  button.cta.gold:hover{background:var(--gold); color:var(--paper);}
  button.cta:focus-visible, a:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}

  .frame-photo{
    width:210px; height:270px; margin:0 auto 6px;
    border-radius:100px 100px 8px 8px;
    border:1px solid var(--gold-soft);
    box-shadow:var(--shadow);
    background: var(--paper) url('') center/cover no-repeat;
    display:flex; align-items:center; justify-content:center;
    color:var(--gold-soft); font-family:'Cormorant Garamond',serif; font-size:2.4rem;
  }

  /* ---------- schedule ---------- */
  .sched-list{ text-align:left; margin:30px auto 0; max-width:380px; }
  .sched-item{ display:grid; grid-template-columns:74px 1fr; gap:16px; padding:14px 0; border-top:1px solid var(--line); }
  .sched-item:last-child{border-bottom:1px solid var(--line);}
  .sched-time{font-family:'Cormorant Garamond',serif; font-size:1.1rem; color:var(--gold); white-space:nowrap;}
  .sched-title{font-size:.98rem;}
  .sched-note{font-size:.85rem; color:var(--ink-soft); margin-top:3px;}

  /* ---------- venues ---------- */
  .venue-card{ text-align:left; border-top:1px solid var(--line); padding:22px 0; }
  .venue-card:last-child{border-bottom:1px solid var(--line);}
  .venue-label{font-size:.78rem; color:var(--gold); margin-bottom:6px;}
  .venue-name{font-family:'Cormorant Garamond',serif; font-size:1.5rem; margin:0 0 4px;}
  .venue-addr{font-size:.92rem; color:var(--ink-soft); margin:0 0 12px;}
  .venue-link{font-size:.85rem; color:var(--ink); text-decoration:underline; text-underline-offset:3px;}

  /* ---------- attire ---------- */
  .swatches{display:flex; gap:14px; justify-content:center; margin:22px 0 4px; flex-wrap:wrap;}
  .swatch{text-align:center; font-size:.78rem; color:var(--ink-soft);}
  .swatch-dot{width:40px; height:40px; border-radius:50%; margin:0 auto 8px; border:1px solid var(--line);}

  /* ---------- faq ---------- */
  .faq-item{ text-align:left; border-top:1px solid var(--line); padding:18px 0; }
  .faq-item:last-child{border-bottom:1px solid var(--line);}
  .faq-q{font-family:'Cormorant Garamond',serif; font-size:1.2rem; margin:0 0 6px;}
  .faq-a{font-size:.92rem; color:var(--ink-soft); line-height:1.6; margin:0;}

  /* ---------- rsvp form ---------- */
  .field{ text-align:left; margin:16px 0; }
  .field label{ display:block; font-size:.82rem; color:var(--ink-soft); margin-bottom:6px; }
  .field input[type=text], .field input[type=number], .field input[type=email], .field select, .field textarea{
    width:100%; font-family:'Jost',sans-serif; font-size:.96rem; color:var(--ink);
    padding:11px 12px; border:1px solid var(--line); border-radius:2px; background:var(--paper);
  }
  .field textarea{min-height:80px; resize:vertical;}
  .attend-toggle{ display:flex; gap:12px; margin:26px 0; }
  .attend-toggle button{
    flex:1; padding:14px 10px; border:1px solid var(--line); background:var(--paper);
    font-family:'Jost',sans-serif; font-size:.9rem; cursor:pointer; border-radius:2px;
    transition:.2s;
  }
  .attend-toggle button.selected{ border-color:var(--gold); background:rgba(180,145,63,.09); color:var(--ink); }
  #rsvp-error{color:var(--rose); font-size:.85rem; min-height:1.2em; margin-top:8px;}
  #rsvp-success{display:none;}

  /* ---------- door ---------- */
  #stage-door{background:var(--ivory);}
  .door-wrap{ position:relative; width:min(420px,86vw); height:min(620px,74vh); perspective:1400px; }
  .door-frame{
    position:absolute; inset:0; border-radius:210px 210px 6px 6px;
    background: linear-gradient(180deg,#FBF7EE,#F1E9D6);
    box-shadow: var(--shadow), inset 0 0 0 1px var(--gold-soft);
  }
  .door-leaf{
    position:absolute; top:0; bottom:0; width:50%;
    background: linear-gradient(180deg,#FCF9F2,#EFE6D0);
    transition: transform 1.1s cubic-bezier(.65,0,.25,1);
    box-shadow: inset 0 0 40px rgba(180,145,63,.08);
  }
  .door-leaf.left{ left:0; border-radius:210px 0 0 6px; transform-origin:left center; border-right:1px solid var(--gold-soft);}
  .door-leaf.right{ right:0; border-radius:0 210px 6px 0; transform-origin:right center; border-left:1px solid var(--gold-soft);}
  .door-leaf::before{
    content:''; position:absolute; top:8%; bottom:8%; left:16%; right:16%;
    border:1px solid var(--gold-soft); border-radius:150px 150px 4px 4px;
  }
  .door-handle{
    position:absolute; top:50%; width:8px; height:34px; background:var(--gold);
    border-radius:4px; transform:translateY(-50%);
  }
  .door-leaf.left .door-handle{right:8%;}
  .door-leaf.right .door-handle{left:8%;}
  #stage-door.open .door-leaf.left{ transform: rotateY(-108deg); }
  #stage-door.open .door-leaf.right{ transform: rotateY(108deg); }

  .scratch-wrap{
    position:absolute; top:16%; left:20%; right:20%; bottom:34%;
    border-radius:150px 150px 4px 4px; overflow:hidden;
    box-shadow: inset 0 0 0 1px var(--gold-soft);
    z-index:5;
  }
  .scratch-under{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 38%, #fff, var(--ivory));
    font-family:'Cormorant Garamond',serif; color:var(--gold); font-size:2.6rem; text-align:center;
  }
  .scratch-under img{width:100%;height:100%;object-fit:cover;}
  #scratch-canvas{position:absolute; inset:0; touch-action:none; cursor:pointer; z-index:6;}

  .door-caption{
    position:absolute; bottom:6%; left:0; right:0; text-align:center;
    font-size:.86rem; color:var(--ink-soft); letter-spacing:.02em;
    transition:opacity .4s ease;
  }
  #stage-door.open .door-caption, #stage-door.revealed .door-caption{opacity:0;}
  .couple-names-under{ position:absolute; top:-6%; left:0; right:0; text-align:center; }

  /* -- door style: cathedral (narrower, taller pointed arch) -- */
  .door-wrap[data-door="cathedral"]{ width:min(360px,80vw); }
  .door-wrap[data-door="cathedral"] .door-frame{ border-radius:280px 280px 4px 4px; }
  .door-wrap[data-door="cathedral"] .door-leaf.left{ border-radius:280px 0 0 4px; }
  .door-wrap[data-door="cathedral"] .door-leaf.right{ border-radius:0 280px 4px 0; }
  .door-wrap[data-door="cathedral"] .door-leaf::before{ border-radius:220px 220px 4px 4px; top:5%; }
  .door-wrap[data-door="cathedral"] .scratch-wrap{ top:12%; border-radius:220px 220px 4px 4px; }

  /* -- door style: minimal (clean rectangular, thin outline) -- */
  .door-wrap[data-door="minimal"] .door-frame{ border-radius:6px; box-shadow: var(--shadow), inset 0 0 0 1px var(--gold-soft); }
  .door-wrap[data-door="minimal"] .door-leaf.left{ border-radius:6px 0 0 6px; }
  .door-wrap[data-door="minimal"] .door-leaf.right{ border-radius:0 6px 6px 0; }
  .door-wrap[data-door="minimal"] .door-leaf::before{ border-radius:2px; top:6%; bottom:6%; left:10%; right:10%; }
  .door-wrap[data-door="minimal"] .scratch-wrap{ border-radius:4px; top:18%; bottom:32%; }

  /* -- door style: floral (arched + small corner accents) -- */
  .door-wrap[data-door="floral"] .door-leaf::after{
    content:''; position:absolute; width:14px; height:14px; border-radius:50%;
    background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
    opacity:.65;
  }
  .door-wrap[data-door="floral"] .door-leaf.left::after{ top:10%; right:22%; }
  .door-wrap[data-door="floral"] .door-leaf.right::after{ top:10%; left:22%; }
  .door-wrap[data-door="floral"] .door-leaf.left::before{ box-shadow: -4px 0 0 -3px var(--gold-soft); }

  @media (max-width:480px){
    .panel{padding-top:30px;}
    .sched-item{grid-template-columns:64px 1fr;}
  }
  @media (prefers-reduced-motion: reduce){
    .door-leaf, .stage{transition:none !important;}
  }

  .skip-link{
    position:fixed; bottom:14px; right:16px; font-size:.72rem; color:var(--ink-soft);
    opacity:.55; background:none; border:none; cursor:pointer; text-decoration:underline;
    z-index:20;
  }
</style>
</head>
<body>

<div id="app">

  <!-- CHAPTER 0 — DOOR / OPENING -->
  <section class="stage active" id="stage-door" data-stage="door">
    <div class="door-wrap" id="door-el">
      <div class="couple-names-under">
        <p class="eyebrow" id="d-eyebrow"></p>
      </div>
      <div class="door-frame"></div>
      <div class="scratch-wrap" id="scratch-wrap">
        <div class="scratch-under" id="scratch-under"></div>
        <canvas id="scratch-canvas"></canvas>
      </div>
      <div class="door-leaf left"><div class="door-handle"></div></div>
      <div class="door-leaf right"><div class="door-handle"></div></div>
      <p class="door-caption" id="door-caption">Scratch the center to begin</p>
    </div>
  </section>

  <!-- CHAPTER 1 — WELCOME -->
  <section class="stage" id="stage-welcome" data-stage="welcome">
    <div class="panel">
      <p class="eyebrow" id="w-eyebrow"></p>
      <h1 class="names" id="w-names"></h1>
      <p class="lede" style="margin:18px auto 0;" id="w-invite"></p>
      <hr class="rule">
      <p class="date-line" id="w-date"></p>
      <p class="date-line" id="w-loc"></p>
      <button class="cta" data-next>Continue</button>
    </div>
  </section>

  <!-- CHAPTER 2 — CEREMONY -->
  <section class="stage" id="stage-ceremony" data-stage="ceremony">
    <div class="panel">
      <p class="eyebrow">The Ceremony</p>
      <h2 class="names" style="font-size:2.1rem;" id="c-name"></h2>
      <p class="lede" id="c-addr" style="margin:6px auto 0;"></p>
      <p class="date-line" id="c-time"></p>
      <a class="venue-link" id="c-map" target="_blank" rel="noopener" style="display:none; margin-top:10px;">View location</a>
      <div><button class="cta" data-next>Continue</button></div>
    </div>
  </section>

  <!-- CHAPTER 3 — SCHEDULE + RECEPTION + ATTIRE + FAQ -->
  <section class="stage" id="stage-reception" data-stage="reception">
    <div class="panel">
      <p class="eyebrow">The Reception</p>
      <h2 class="names" style="font-size:2.1rem;" id="r-name"></h2>
      <p class="lede" id="r-addr" style="margin:6px auto 0;"></p>
      <p class="date-line" id="r-time"></p>
      <a class="venue-link" id="r-map" target="_blank" rel="noopener" style="display:none; margin-top:10px;">View location</a>

      <hr class="rule">
      <p class="eyebrow" id="s-title"></p>
      <div class="sched-list" id="sched-list"></div>

      <hr class="rule">
      <p class="eyebrow" id="a-title"></p>
      <p class="lede" style="margin:0 auto;" id="a-text"></p>
      <p class="lede" style="margin:8px auto 0; font-style:italic;" id="a-note"></p>
      <div class="swatches" id="a-swatches"></div>

      <hr class="rule">
      <p class="eyebrow" id="f-title"></p>
      <div id="faq-list" style="text-align:left;"></div>

      <div><button class="cta" data-next>Continue to RSVP</button></div>
    </div>
  </section>

  <!-- CHAPTER 4 — RSVP -->
  <section class="stage" id="stage-rsvp" data-stage="rsvp">
    <div class="panel">
      <p class="eyebrow" id="rv-eyebrow">Kindly Reply</p>
      <h2 class="names" style="font-size:2rem;" id="rv-title"></h2>
      <p class="lede" style="margin:6px auto 0;" id="rv-lede"></p>

      <form id="rsvp-form">
        <div class="attend-toggle" role="group" aria-label="Attendance">
          <button type="button" data-attend="yes" id="btn-yes">I'd be honored</button>
          <button type="button" data-attend="no" id="btn-no">With regret, I can't attend</button>
        </div>

        <div id="rsvp-extra" style="display:none;">
          <div class="field">
            <label for="f-name">Full name</label>
            <input type="text" id="f-name" required>
          </div>
          <div class="field" id="f-guests-wrap">
            <label for="f-guests">Total guests attending (including you)</label>
            <input type="number" id="f-guests" min="1" value="1">
          </div>
          <div class="field" id="f-meal-wrap" style="display:none;">
            <label for="f-meal">Main course preference</label>
            <select id="f-meal"></select>
          </div>
          <div class="field" id="f-song-wrap" style="display:none;">
            <label for="f-song">A song that would get you on the dance floor</label>
            <input type="text" id="f-song">
          </div>
          <div class="field">
            <label for="f-msg">Message for the couple (optional)</label>
            <textarea id="f-msg"></textarea>
          </div>
          <button class="cta gold" type="submit">Send my reply</button>
        </div>
      </form>
      <p id="rsvp-error"></p>
      <div id="rsvp-success">
        <hr class="rule">
        <p class="lede" style="margin:0 auto;">Thank you. We're so happy to have your reply, and we can't wait to celebrate with you.</p>
      </div>
    </div>
  </section>

</div>

<button class="skip-link" id="skip-btn">Skip intro</button>

<script>
(function(){
  var CFG = window.WEDDING || {};
  var stages = ['door','welcome','ceremony','reception','rsvp'];
  var idx = 0;

  function $(sel, root){ return (root||document).querySelector(sel); }
  function fmt(dateStr, opts){
    try{ return new Date(dateStr).toLocaleDateString('en-US', opts); }catch(e){ return dateStr; }
  }

  /* ---------------- populate content from config ---------------- */
  function populate(){
    document.body.setAttribute('data-theme', CFG.theme || 'classic-ivory');
    $('#door-el').setAttribute('data-door', CFG.doorStyle || 'arched');

    var names = (CFG.partner1||'Jhau') + ' <span class="amp">&amp;</span> ' + (CFG.partner2||'Sheila');

    $('#d-eyebrow').textContent = (CFG.partner1||'') + ' & ' + (CFG.partner2||'');
    $('#door-caption').textContent = 'Scratch the center to begin';

    $('#w-eyebrow').textContent = CFG.familiesLine || '';
    $('#w-names').innerHTML = names;
    $('#w-invite').textContent = CFG.inviteLine || '';
    $('#w-date').textContent = CFG.date ? fmt(CFG.date, {weekday:'long', year:'numeric', month:'long', day:'numeric'}) : '';
    $('#w-loc').textContent = CFG.locationShort || '';

    var venues = CFG.venues || [];
    var ceremony = venues[0] || {};
    var reception = venues[1] || {};

    $('#c-name').textContent = ceremony.name || '';
    $('#c-addr').textContent = ceremony.address || '';
    $('#c-time').textContent = ceremony.time || '';
    if(ceremony.mapUrl){ $('#c-map').href = ceremony.mapUrl; $('#c-map').style.display='inline-block'; }

    $('#r-name').textContent = reception.name || '';
    $('#r-addr').textContent = reception.address || '';
    $('#r-time').textContent = reception.time || '';
    if(reception.mapUrl){ $('#r-map').href = reception.mapUrl; $('#r-map').style.display='inline-block'; }

    $('#s-title').textContent = CFG.scheduleTitle || 'The Day';
    var schedWrap = $('#sched-list');
    (CFG.schedule||[]).forEach(function(item){
      var el = document.createElement('div');
      el.className='sched-item';
      el.innerHTML = '<div class="sched-time">'+item.time+'</div><div><div class="sched-title">'+item.title+'</div>'+(item.note?'<div class="sched-note">'+item.note+'</div>':'')+'</div>';
      schedWrap.appendChild(el);
    });

    $('#a-title').textContent = CFG.attireTitle || 'Attire';
    $('#a-text').textContent = CFG.attireText || '';
    $('#a-note').textContent = CFG.attireNote || '';
    var swWrap = $('#a-swatches');
    (CFG.palette||[]).forEach(function(c){
      var el = document.createElement('div'); el.className='swatch';
      el.innerHTML = '<div class="swatch-dot" style="background:'+c.hex+'"></div>'+c.name;
      swWrap.appendChild(el);
    });

    $('#f-title').textContent = CFG.faqTitle || 'Good to Know';
    var faqWrap = $('#faq-list');
    (CFG.faq||[]).forEach(function(item){
      var el = document.createElement('div'); el.className='faq-item';
      el.innerHTML = '<p class="faq-q">'+item.q+'</p><p class="faq-a">'+item.a+'</p>';
      faqWrap.appendChild(el);
    });

    var rsvp = CFG.rsvp || {};
    $('#rv-title').textContent = rsvp.title || 'Kindly Reply';
    var deadlineTxt = rsvp.deadline ? ' by ' + fmt(rsvp.deadline, {month:'long', day:'numeric'}) : '';
    $('#rv-lede').textContent = (rsvp.lede || '') + deadlineTxt + '.';

    if((rsvp.mealOptions||[]).length){
      var sel = $('#f-meal');
      rsvp.mealOptions.forEach(function(m){ var o=document.createElement('option'); o.value=m; o.textContent=m; sel.appendChild(o); });
      $('#f-meal-wrap').style.display='block';
    }
    if(rsvp.askSongRequest){ $('#f-song-wrap').style.display='block'; }
    if(rsvp.maxGuests){ $('#f-guests').max = rsvp.maxGuests; }

    var photo = CFG.heroPhoto;
    var under = $('#scratch-under');
    if(photo){ under.innerHTML = '<img src="'+photo+'" alt="">'; }
    else{ under.textContent = (CFG.partner1||'J')[0] + '&' + (CFG.partner2||'S')[0]; }
  }

  /* ---------------- door / chapter transitions ---------------- */
  var door = $('#stage-door');

  function goTo(name){
    stages.forEach(function(s){
      $('#stage-'+s).classList.toggle('active', s===name);
    });
  }

  function closeDoorThenGo(nextName){
    door.classList.remove('open');
    goTo('door');
    door.classList.remove('revealed');
    // brief pause with doors visually shut, then switch scene
    setTimeout(function(){ goTo(nextName); }, 550);
  }

  document.addEventListener('click', function(e){
    if(e.target.matches('[data-next]')){
      var order = ['welcome','ceremony','reception','rsvp'];
      var current = order.indexOf(document.querySelector('.stage.active').dataset.stage);
      var next = order[current+1];
      if(next){ closeDoorThenGo(next); }
    }
  });

  $('#skip-btn').addEventListener('click', function(){
    goTo('welcome');
    this.style.display='none';
  });

  /* ---------------- scratch-to-reveal ---------------- */
  var canvas = $('#scratch-canvas');
  var ctx = canvas.getContext('2d');
  var scratchWrap = $('#scratch-wrap');
  var revealed = false;
  var canvasW = 0, canvasH = 0;

  function drawFoil(){
    var w = canvas.width, h = canvas.height;
    var g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0, '#EFDFB8');
    g.addColorStop(.45, '#DEC17F');
    g.addColorStop(.55, '#E9CE93');
    g.addColorStop(1, '#CBA85F');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);

    // fine metallic grain (random speckle), gives a real foil-card look
    for(var n=0; n<Math.round(w*h/9); n++){
      var gx = Math.random()*w, gy = Math.random()*h;
      var shade = Math.random();
      ctx.fillStyle = shade > .5 ? 'rgba(255,255,255,'+(Math.random()*.10)+')' : 'rgba(90,66,30,'+(Math.random()*.08)+')';
      ctx.fillRect(gx, gy, 1, 1);
    }

    // soft sheen sweep
    var sheen = ctx.createLinearGradient(0,0,w*.6,h*.6);
    sheen.addColorStop(0,'rgba(255,255,255,.22)');
    sheen.addColorStop(.5,'rgba(255,255,255,0)');
    ctx.fillStyle = sheen;
    ctx.fillRect(0,0,w,h);

    // thin ornamental border
    ctx.strokeStyle = 'rgba(120,90,40,.4)';
    ctx.lineWidth = 1;
    ctx.strokeRect(9,9,w-18,h-18);

    // small centered mark, understated
    ctx.fillStyle = 'rgba(80,58,26,.6)';
    ctx.textAlign = 'center';
    var initials = ((CFG.partner1||'J')[0] + ' & ' + (CFG.partner2||'S')[0]);
    ctx.font = '500 '+Math.round(h*0.1)+'px "Cormorant Garamond", serif';
    ctx.fillText(initials, w/2, h*0.5);
    ctx.font = '400 '+Math.max(10,Math.round(h*0.032))+'px "Jost", sans-serif';
    ctx.fillStyle = 'rgba(80,58,26,.5)';
    ctx.fillText('scratch to reveal', w/2, h*0.62);
  }

  function sizeCanvas(force){
    var r = scratchWrap.getBoundingClientRect();
    var w = Math.round(r.width), h = Math.round(r.height);
    if(!force && Math.abs(w-canvasW) < 4 && Math.abs(h-canvasH) < 4) return; // ignore trivial mobile viewport jitter
    if(revealed) return; // never redraw over an already-revealed photo
    canvasW = w; canvasH = h;
    canvas.width = w; canvas.height = h;
    drawFoil();
  }
  sizeCanvas(true);
  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ sizeCanvas(false); }, 300);
  });

  function pos(e){
    var r = canvas.getBoundingClientRect();
    var p = e.touches ? e.touches[0] : e;
    return {x: p.clientX - r.left, y: p.clientY - r.top};
  }
  var lastPt = null;
  function scratchTo(x,y){
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.lineWidth = 62 + Math.random()*14;
    ctx.beginPath();
    if(lastPt){ ctx.moveTo(lastPt.x, lastPt.y); } else { ctx.moveTo(x-0.1,y-0.1); }
    ctx.lineTo(x,y);
    ctx.stroke();
    lastPt = {x:x,y:y};
  }
  var hintShown = {half:false};
  function checkReveal(){
    if(revealed) return;
    var data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
    var cleared=0, total=0;
    for(var i=3;i<data.length;i+=4*9){ total++; if(data[i]===0) cleared++; }
    var ratio = cleared/total;
    if(!hintShown.half && ratio > 0.15){
      hintShown.half = true;
      $('#door-caption').textContent = 'Almost there…';
    }
    if(ratio > 0.35){
      revealed = true;
      canvas.style.transition='opacity .6s ease';
      canvas.style.opacity='0';
      advanceThroughDoor();
    }
  }

  function advanceThroughDoor(){
    try{
      door.classList.add('revealed');
      setTimeout(function(){
        door.classList.add('open');
      }, 450);
      setTimeout(function(){
        goTo('welcome');
      }, 1550);
    }catch(err){
      // safety net: never leave the guest stranded on the door
      goTo('welcome');
    }
  }
  var drawing=false;
  function start(e){ drawing=true; lastPt=null; var p=pos(e); scratchTo(p.x,p.y); checkReveal(); e.preventDefault(); }
  function move(e){ if(!drawing) return; var p=pos(e); scratchTo(p.x,p.y); checkReveal(); e.preventDefault(); }
  function end(){ drawing=false; lastPt=null; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);

  /* ---------------- RSVP form ---------------- */
  var attend = null;
  $('#btn-yes').addEventListener('click', function(){ attend='yes'; setAttend(); });
  $('#btn-no').addEventListener('click', function(){ attend='no'; setAttend(); });
  function setAttend(){
    $('#btn-yes').classList.toggle('selected', attend==='yes');
    $('#btn-no').classList.toggle('selected', attend==='no');
    $('#rsvp-extra').style.display='block';
    $('#f-guests-wrap').style.display = attend==='yes' ? 'block' : 'none';
    $('#f-meal-wrap').style.display = (attend==='yes' && (CFG.rsvp&&CFG.rsvp.mealOptions&&CFG.rsvp.mealOptions.length)) ? 'block':'none';
    $('#f-song-wrap').style.display = (attend==='yes' && CFG.rsvp && CFG.rsvp.askSongRequest) ? 'block':'none';
  }

  $('#rsvp-form').addEventListener('submit', function(e){
    e.preventDefault();
    var err = $('#rsvp-error'); err.textContent='';
    if(!attend){ err.textContent='Please let us know if you can attend.'; return; }
    var name = $('#f-name').value.trim();
    if(!name){ err.textContent='Please enter your name.'; return; }

    var payload = {
      name: name,
      attending: attend,
      guests: attend==='yes' ? ($('#f-guests').value||1) : 0,
      meal: $('#f-meal') && $('#f-meal').value || '',
      song: $('#f-song').value || '',
      message: $('#f-msg').value || ''
    };

    var rsvp = CFG.rsvp || {};
    if(rsvp.mode === 'email' && rsvp.email){
      var subject = encodeURIComponent('RSVP — ' + name);
      var body = encodeURIComponent(
        'Name: '+payload.name+'\n'+
        'Attending: '+(payload.attending==='yes'?'Yes':'No')+'\n'+
        (payload.attending==='yes' ? 'Guests: '+payload.guests+'\n' : '') +
        (payload.meal ? 'Meal: '+payload.meal+'\n' : '') +
        (payload.song ? 'Song request: '+payload.song+'\n' : '') +
        (payload.message ? 'Message: '+payload.message+'\n' : '')
      );
      window.location.href = 'mailto:'+rsvp.email+'?subject='+subject+'&body='+body;
      showSuccess();
    } else if(rsvp.mode === 'webhook' && rsvp.webhookUrl){
      fetch(rsvp.webhookUrl, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)})
        .then(function(){ showSuccess(); })
        .catch(function(){ err.textContent = 'Something went wrong sending your reply. Please try again.'; });
    } else if(rsvp.mode === 'supabase' && rsvp.supabase && rsvp.supabase.url){
      fetch(rsvp.supabase.url+'/rest/v1/'+(rsvp.supabase.table||'rsvps'), {
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':rsvp.supabase.anonKey,'Authorization':'Bearer '+rsvp.supabase.anonKey,'Prefer':'return=minimal'},
        body: JSON.stringify(payload)
      }).then(function(){ showSuccess(); })
        .catch(function(){ err.textContent = 'Something went wrong sending your reply. Please try again.'; });
    } else {
      err.textContent = 'RSVP is not fully configured yet — please contact the couple directly.';
    }
  });

  function showSuccess(){
    $('#rsvp-form').style.display='none';
    $('#rsvp-success').style.display='block';
  }

  populate();
})();
</script>
</body>
</html>
